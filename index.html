<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e98fa0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Enxoval Casa Nova</title><style>
:root{--bg:#fbf7f2;--card:#fffdf9;--ink:#34415b;--muted:#7f8795;--pink:#e98fa0;--pink2:#f9dfe4;--blue:#8fb4d9;--green:#9bc9b1;--purple:#b9a8dc;--gold:#caa76a;--shadow:0 8px 24px #6d5c4b12}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf7,#f7f4ef);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;align-items:center;padding:12px 8px 18px}.brand{display:flex;gap:12px;align-items:center}.house{font-size:42px}.brand h1{font-size:31px;margin:0;color:#40516b}.brand h1 span{display:block;color:#d9778c;font-family:cursive;font-weight:500}.tag{font-family:cursive;color:#a45c73;font-size:20px;max-width:260px;text-align:right}.summary{background:#fffdf9;border:1px solid #eadfd4;border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;gap:24px;align-items:center}.ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pink) 0deg,#e8e9ec 0);position:relative;font-weight:800}.ring:after{content:"";position:absolute;inset:8px;background:var(--card);border-radius:50%}.ring b{position:relative;z-index:1}.stats{flex:1}.stats strong{font-size:20px}.stats small{color:var(--muted)}.statline{display:flex;gap:16px;margin-top:6px;color:#667085}.actions{display:flex;gap:10px}.btn{background:var(--pink2);color:#9b5266;padding:12px 16px;border-radius:14px;font-weight:700}.search{margin:16px 0;display:flex;gap:10px}.search input{flex:1;border:1px solid #e4ddd5;background:#fff;border-radius:14px;padding:13px 16px;outline:none}.tabs{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;padding:11px 15px;border-radius:14px;background:#fff;border:1px solid #eadfd4;color:#657083}.tab.active{background:var(--pink);color:white;border-color:var(--pink)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid #e8dfd5;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.cardhead{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}.cardhead small{font-weight:600}.kitchen{background:#fff0e8}.mesa{background:#e8f6ee}.quarto{background:#f0eafa}.banheiro{background:#e8f3fc}.limpeza{background:#fff4dd}.extras{background:#fde9ed}.items{padding:12px 16px}.item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed #e7e1d9}.item:last-child{border-bottom:0}.item input{width:18px;height:18px;accent-color:var(--pink)}.item.done label{text-decoration:line-through;color:#9ca3af}.item label{flex:1;font-size:14px}.badge{font-size:11px;padding:3px 7px;border-radius:10px;background:#edf0f3;color:#667085}.notes{margin-top:16px;background:#fff;border:1px solid #eadfd4;border-radius:20px;padding:18px}.notes textarea{width:100%;min-height:90px;border:0;outline:0;resize:vertical}.bottom{position:sticky;bottom:10px;margin-top:18px;background:#fffdf9ee;backdrop-filter:blur(12px);border:1px solid #eadfd4;border-radius:18px;padding:8px;display:flex;justify-content:space-around;box-shadow:var(--shadow)}.bottom button{background:none;color:#7b8492;padding:8px}.bottom button.active{color:var(--pink);font-weight:800}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#34415b;color:white;padding:10px 14px;border-radius:12px;display:none}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.tag{display:none}}@media(max-width:560px){.app{padding:10px}.hero{padding-top:4px}.brand h1{font-size:24px}.house{font-size:34px}.summary{padding:14px;gap:12px}.ring{width:70px;height:70px}.statline{font-size:12px;flex-wrap:wrap}.actions{display:none}.grid{grid-template-columns:1fr}.tabs{margin-right:-10px}.card{border-radius:17px}.item label{font-size:14px}.bottom{bottom:6px}}
</style></head><body><main class="app"><header class="hero"><div class="brand"><div class="house">🏠</div><div><h1>Enxoval <span>Casa Nova</span></h1><small>Juntos construindo o nosso lar ♡</small></div></div><div class="tag">Cada item é um passo para o nosso sonho! ♡</div></header><section class="summary"><div class="ring" id="ring"><b id="pct">0%</b></div><div class="stats"><strong>Progresso do Enxoval</strong><br><small><span id="doneCount">0</span> de <span id="totalCount">0</span> itens marcados</small><div class="statline"><span>✓ <b id="done2">0</b> concluídos</span><span>○ <b id="pending">0</b> pendentes</span></div></div><div class="actions"><button class="btn" onclick="resetAll()">↺ Reiniciar</button></div></section><div class="search"><input id="search" placeholder="🔎 Procurar item..." oninput="render()"><button class="btn" onclick="exportData()">Salvar lista</button></div><nav class="tabs" id="tabs"></nav><section class="grid" id="grid"></section><section class="notes"><strong>♡ Anotações</strong><p style="margin:5px 0;color:#8b93a0;font-size:13px">Registre observações, valores ou quem ficou responsável por cada item.</p><textarea id="notes" placeholder="Escreva aqui..."></textarea></section><nav class="bottom"><button class="active">⌂<br>Início</button><button onclick="document.getElementById('search').focus()">☑<br>Lista</button><button>🎁<br>Presentes</button><button>▥<br>Relatório</button><button>•••<br>Mais</button></nav></main><div class="toast" id="toast"></div><script>
const data={
"Cozinha":["Jogo de panelas inox (5-6 peças)","Frigideira antiaderente","Panela pequena para molhos","Escorredor de macarrão inox","Assadeiras (3 tamanhos)","Forma de bolo redonda","Forma retangular","Tábua de corte (2)","Facas (chef, legumes e pão)","Tesoura de cozinha","Descascador de legumes","Ralador","Peneira","Escumadeira","Concha","Espátula","Pegador de massa","Colheres de servir","Kit utensílios silicone preto","Escorredor de louças","Escorredor de alimentos","Funil","Porta-detergente","Porta-esponja","Lixeira de cozinha","Potes herméticos (kit)","Organizadores de geladeira","Organizador de tampas","Organizador de gavetas","Porta-temperos","Jarra para água e suco","Batedor de arame (fouet)","Abridor de garrafas","Prensa de alho","Tapete de pia","Luvas de cozinha","Cronômetro de cozinha","Pano de prato","Potes plásticos"],
"Mesa e Jantar":["Jogo de pratos rasos (6)","Pratos fundos (6)","Pratos de sobremesa (6)","Bowls (6)","Xícaras de café (6)","Canecas (6)","Copos de água (6)","Taças de vinho (6)","Taças coringa (6)","Jogo americano (6)","Guardanapos de pano (6)","Porta-guardanapos (6)","Travessas para servir (3)","Saladeira","Prato de bolo com pé","Bandeja","Açucareiro","Galheteiro","Jogo de talheres (6 pessoas)"],
"Quarto":["Colchão Queen","Protetor de colchão","Protetores de travesseiro (4)","Travesseiros (4)","Jogo de cama Queen (3)","Lençóis avulsos (3)","Edredom Queen","Manta decorativa","Cobertor leve","Cobertor pesado","Saia para cama","Cabides de veludo (kit)","Organizadores de armário (kit)","Caixas organizadoras","Sapateira","Cesto de roupas","Luminária de leitura","Abajur (2)","Espelho de corpo inteiro"],
"Banheiro":["Toalhas de banho (4)","Toalhas de rosto (4)","Toalhas de piso (2)","Tapete de banheiro (2)","Lixeira com tampa","Cesto de roupas","Porta-sabonete líquido","Porta-escovas de dente","Porta-sabonete em barra","Bandeja organizadora","Organizadores de gaveta (kit)","Cortina de box","Escova sanitária","Dispenser para shampoo","Ganchos/porta-toalhas","Porta papel higiênico","Kit banheiro (acessórios)"],
"Lavanderia":["Cesto de roupas grande","Varal de chão","Prendedores de roupa","Balde","Escova de limpeza","Panos de chão (kit)","Flanelas (kit)","Pano de microfibra (kit)","Saboneteira para roupas","Organizador para produtos","Lixeira para lavanderia","Vassoura extra","Rodo extra","Tábua de passar roupa","Ferro de passar roupa"],
"Sala":["Sofá","Manta para sofá","Almofadas decorativas","Rack ou painel","Mesa de centro","Mesa lateral","Tapete","Cortinas","Porta-controles","Bandeja decorativa","Porta-retratos","Vaso decorativo","Espelho decorativo","Luminária de piso","Luminária de mesa"],
"Limpeza":["Mop","Balde com centrifugação","Escova sanitária extra","Pá extra","Rodo extra","Luvas de limpeza","Pulverizadores (2)","Esponjas (kit)","Panos de limpeza (kit)","Detergente neutro","Desinfetante","Multiuso","Sabão em pó","Amaciante","Sacos para lixo (kit)","Vassoura de canto"],
"Itens Extras":["Kit ferramentas básico","Extensão elétrica","Fita adesiva","Pilhas (kit)","Lâmpadas extras","Kit primeiros socorros","Guarda-chuva","Pendureiros adesivos","Chaveiro reserva","Adaptadores de tomada","Protetores de tomadas","Tranca para portas","Cofrinho","Livro de receitas","Quadros decorativos","Outros"]};
const already=["Fondue doce","Máquina n’ores/s’mores","Pegador de milho","Colher para sorvete","Cortador de pizza","Espremedor de limão","Abridor de lata","Medidores culinários","Clipes que fecham embalagens abertas","2 toalhas grandes 100% algodão","2 toalhas de rosto 100% algodão","1 toalha de mesa de jantar","Vassoura","Pá","Rodo"];
let state=JSON.parse(localStorage.getItem('enxoval-state')||'{}'); let notes=localStorage.getItem('enxoval-notes')||''; document.getElementById('notes').value=notes; document.getElementById('notes').addEventListener('input',e=>{localStorage.setItem('enxoval-notes',e.target.value)});
const colors={"Cozinha":"kitchen","Mesa e Jantar":"mesa","Quarto":"quarto","Banheiro":"banheiro","Lavanderia":"limpeza","Sala":"extras","Limpeza":"limpeza","Itens Extras":"extras"};
function key(c,i){return c+'::'+i} function render(){let q=document.getElementById('search').value.toLowerCase();let tabs=['Todos',...Object.keys(data)];document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${(!window.cat&&t==='Todos')||(window.cat===t)?'active':''}" onclick="window.cat='${t==='Todos'?'':t}';render()">${t}</button>`).join('');let cats=window.cat?[window.cat]:Object.keys(data);document.getElementById('grid').innerHTML=cats.map(c=>{let arr=data[c].map((x,i)=>({x,i})).filter(o=>o.x.toLowerCase().includes(q));if(!arr.length)return '';let done=arr.filter(o=>state[key(c,o.i)]).length;return `<article class="card"><div class="cardhead ${colors[c]||''}"><span>${icon(c)} ${c}</span><small>${done}/${data[c].length}</small></div><div class="items">${arr.map(o=>{let k=key(c,o.i),d=!!state[k];return `<div class="item ${d?'done':''}"><input type="checkbox" ${d?'checked':''} onchange="toggle('${encodeURIComponent(k)}',this.checked)"><label>${o.x}</label></div>`}).join('')}</div></article>`}).join('')||'<div class="empty">Nenhum item encontrado.</div>';updateSummary()}
function icon(c){return ({Cozinha:'🍳','Mesa e Jantar':'🍽️',Quarto:'🛏️',Banheiro:'🛁',Lavanderia:'🧺',Sala:'🛋️',Limpeza:'🧹','Itens Extras':'🎁'})[c]||'♡'}
function toggle(k,v){state[decodeURIComponent(k)]=v;localStorage.setItem('enxoval-state',JSON.stringify(state));render();toast(v?'Item marcado!':'Item desmarcado!')}
function updateSummary(){let total=Object.values(data).reduce((s,a)=>s+a.length,0),done=Object.keys(state).filter(k=>state[k]).length;let pct=total?Math.round(done/total*100):0;document.getElementById('totalCount').textContent=total;document.getElementById('doneCount').textContent=done;document.getElementById('done2').textContent=done;document.getElementById('pending').textContent=total-done;document.getElementById('pct').textContent=pct+'%';document.getElementById('ring').style.background=`conic-gradient(var(--pink) ${pct*3.6}deg,#e8e9ec 0)`}
function resetAll(){if(confirm('Desmarcar todos os itens?')){state={};localStorage.setItem('enxoval-state','{}');render()}}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1200)}function exportData(){let blob=new Blob([JSON.stringify({state,notes:document.getElementById('notes').value},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-enxoval.json';a.click();toast('Lista salva no aparelho!')}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
